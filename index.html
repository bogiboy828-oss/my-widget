<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפיצוצייה של הג'ינג'י</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #e65100;
            /* תמונת הלוגו ברקע שחוזרת על עצמה */
            background-image: url('https://i.ibb.co/4n0m32h/logo.png'); 
            background-repeat: repeat;
            background-size: 200px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: #ffffff;
            overflow: hidden;
        }

        .header {
            margin-top: 25px;
            margin-bottom: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 35px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .chat-container {
            width: 90%;
            max-width: 1100px;
            height: 75vh;
            background: #2b2d31;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        widgetbot-html-embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>הפיצוצייה של הג'ינג'י</h1>
    </div>

    <div class="chat-container">
        <widgetbot
            server="1541434376905170985"
            channel="1541438231357296640"
            width="100%"
            height="100%">
        </widgetbot>
    </div>

    <!-- Script לטעינת Embed מלא מבית WidgetBot -->
    <script src="https://cdn.jsdelivr.net/npm/@widgetbot/html-embed"></script>

</body>
</html>
